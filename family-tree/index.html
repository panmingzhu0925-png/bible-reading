<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>圣经人物家谱 · 圣经阅读</title>
<link rel="stylesheet" href="./style.css?v=19">
</head>
<body>
<header><div><h1 id="treeTitle">圣经人物树</h1><p class="subtitle" id="treeSubtitle"></p></div><div class="preview-links"><a href="../genealogy-images.html">原图正背面 ↗</a><a class="back-link" href="../index.html#pagePeople">返回圣经阅读</a></div></header>
<p class="preview-note">家谱阅读 · 一位具名妻妾标在父亲旁，多位妻妾在孩子旁标出生母。</p>
<nav id="pageNav" class="page-nav" aria-label="家谱分段"></nav>
<nav id="tribeNav" class="tribe-nav" aria-label="十二支派分支" hidden><label for="tribePicker">分支查看</label><select id="tribePicker" aria-label="选择支派"></select><a id="tribeOverview">返回十二支派总览</a></nav>
<nav id="gospelNav" class="gospel-nav" aria-label="犹大支派的两份福音家谱" hidden></nav>
<nav id="relatedFamilyNav" class="related-family-nav" aria-label="犹大家谱与相关家族" hidden><a id="judahFamilyLink">犹大家谱</a><label for="relatedFamilyPicker">相关家族 · 单独查看</label><select id="relatedFamilyPicker" aria-label="选择相关家族"></select></nav>
<details id="maternalGuide" class="maternal-guide" hidden><summary></summary><div class="maternal-guide-body"></div></details>
<nav class="toolbar" aria-label="家谱工具">
<button id="mainline">主线展开</button><button id="overview">支系概览</button><button id="all" class="active">全部展开</button>
<select id="orientation" aria-label="排列方向"><option value="TB" selected>竖向 · 上 → 下</option><option value="LR">横向 · 左 → 右</option></select><button id="fit">适合窗口</button>
<div class="search"><input id="search" aria-label="搜索人物或族群" placeholder="搜索人物或族群…" autocomplete="off"><div id="results" class="results" role="region" aria-label="搜索结果"></div></div>
</nav>
<nav id="quickFocus" class="quick-focus" aria-label="快速定位人物" hidden></nav>
<nav id="branchScope" class="branch-scope" aria-label="当前支系" hidden><span></span><button id="fullTree">返回本支派全图</button></nav>
<main class="workbench"><section class="diagram-shell" aria-label="可缩放的圣经家谱">
<div class="legend"><span><i class="red"></i><span id="mainLegend">家谱主线</span></span><span><i></i>亲子</span><span><i class="blue"></i>妻妾／生母标注可点击</span><span id="tribeLegend" hidden><i class="tribe"></i>支派标记</span><span id="lineageLegend" hidden><i class="genealogy-dash"></i>虚线：关系性质见旁注</span><span id="groupLegend"><i class="dash"></i>族群 ◇</span></div>
<div id="viewport"><div id="stage"><div id="chart" role="group" aria-label="圣经人物树，可点击姓名查看经文出处"></div></div></div>
<div class="diagram-footer"><span id="count"></span><span class="desktop-tip">拖动平移 · 滚轮缩放 · 点击姓名看经文</span><span class="mobile-tip">拖动平移 · 双指缩放</span><div class="zoom"><button id="minus" aria-label="缩小">−</button><span id="zoomLabel">100%</span><button id="plus" aria-label="放大">+</button></div></div>
</section><aside id="details" aria-label="人物详情"></aside></main>
<p class="scope"><span id="scopeCount"></span><span class="extra-scope">点击“＋数字”展开旁支；非同代时间轴。</span><button id="tribesToggle" hidden>十二子与支派对照</button><button id="sourcesToggle">查看来源与收录说明</button></p>
<section id="sources" class="source-panel" hidden></section>
<script src="./vendor/echarts.min.js" defer></script>
<script src="./tree-data.js?v=19" defer></script>
<script src="./compact-layout.js?v=19" defer></script>
<script src="./app.js?v=19" defer></script>
</body>
</html>
